<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <style>
        /* --- ИСПОЛЬЗУЕМ ТОТ ЖЕ CSS, ЧТО И В РЕГИСТРАЦИИ --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;

            /* ЦЕНТРОВКА (Такая же, как на странице регистрации) */
            margin: 50px auto;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px; /* Чуть больше отступ, как в регистрации */
            font-weight: bold;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        /* Поля ввода - стиль 1 в 1 как на регистрации */
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        /* Кнопка - ТЕПЕРЬ СИНЯЯ (как на регистрации) */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #007bff; /* Синий цвет для единого стиля */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover { background: #0056b3; } /* Темно-синий при наведении */

        .links { text-align: center; margin-top: 20px; font-size: 14px; }
        .links a { color: #007bff; text-decoration: none; }
        .links a:hover { text-decoration: underline; }

        /* Блок ошибок */
        .errorlist {
            color: #721c24;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 5px;
            list-style: none;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Log In</h2>

        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="errorlist">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="form-group">
                <label>Username or Email</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label>Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-submit">Log In</button>
        </form>

        <div class="links">
            <a href="{% url 'signup' %}">Create an account</a>
            <br><br>
            <a href="/" style="color: #999; font-size: 12px;">Back to Home</a>
        </div>
    </div>

</body>
</html>
