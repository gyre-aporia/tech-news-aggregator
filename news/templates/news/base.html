{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Aggregator</title>
    <link rel="stylesheet" href="{% static 'news/style.css' %}">
</head>
<body>

    <header>
        <a href="/" class="logo">NewsAggregator</a>

        <div class="nav-links">
            <a href="/">Home</a> {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" style="color: #007bff;">
                    {% if user.profile.avatar %}
                        <img src="{{ user.profile.avatar.url }}" class="nav-avatar">
                    {% else %}
                        <span style="font-size: 24px; margin-right: 8px;">👤</span>
                    {% endif %}
                    {{ user.username }}
                </a>

                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log In</a>
                <a href="{% url 'signup' %}">Sign Up</a>
            {% endif %}
        </div>
    </header>

    <div class="content-container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
