<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>
{% extends 'news/base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">

    <h2 style="text-align: center; margin-bottom: 20px;">Edit Profile </h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <fieldset style="border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <legend style="font-weight: bold; color: #007bff; padding: 0 10px;">Account Info</legend>

            {% for field in u_form %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #555;">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
        </fieldset>

        <fieldset style="border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <legend style="font-weight: bold; color: #28a745; padding: 0 10px;">Profile Details</legend>

            {% for field in p_form %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #555;">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
        </fieldset>

        <button type="submit" style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold;">
            Save All Changes
        </button>

        <div style="text-align: center; margin-top: 15px;">
            <a href="{% url 'profile' %}" style="text-decoration: none; color: #666;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
</body>
</html>
